version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sotka_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sotka}
      POSTGRES_USER: ${POSTGRES_USER:-sotka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sotka_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sotka}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sotka_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: sotka_backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    environment:
      # Тот же ambient-cwd, что подвёл воркер (см. celery_worker): uvicorn тоже
      # console-script, полагаться на подстановку cwd незачем.
      PYTHONPATH: /app
    extra_hosts:
      # Принудительно резолвим api.telegram.org в IPv4 — у docker-сети нет
      # IPv6-маршрутизации, AAAA-резолв даёт ENETUNREACH/timeout
      - "api.telegram.org:149.154.167.220"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Без --reload: watcher на 2GB VPS лишний, а подхват полузаписанного файла при
    # git pull ронял воркеры под нагрузкой. Код по-прежнему смонтирован (./backend:/app),
    # поэтому деплой = git pull + docker compose restart backend, ребилд не нужен.
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  celery_worker:
    build: ./backend
    container_name: sotka_celery
    env_file: .env
    environment:
      # /app в sys.path попадал только через cwd, который celery подставляет при
      # загрузке приложения. Модулям вроде core/services/models это сходило с рук —
      # к моменту вызова задачи они уже в sys.modules, их импортировали соседние
      # задачи при старте воркера. А `api` в воркере не нужен больше никому,
      # поэтому единственный реальный поиск по sys.path — импорт api.seo внутри
      # ping_indexnow — падал с ModuleNotFoundError каждый день в 08:00 МСК.
      PYTHONPATH: /app
      # Engine без пула: соединение не должно переживать event loop задачи (см.
      # db/database.py). worker.py выставляет это и сам, но только для себя —
      # разовые скрипты через `docker compose exec ... python -c` импортируют
      # db.database мимо worker.py и получали пул: два asyncio.run() в одном
      # процессе тут же дают «attached to a different loop». Здесь — на весь
      # контейнер, независимо от точки входа.
      SOTKA_DB_NULLPOOL: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      # Только чтение: утренний health-check смотрит возраст и размер дампов
      # Postgres. Пишет их cron на хосте (scripts/backup_db.sh), контейнеру тут
      # нужно исключительно подглядывать.
      - /var/backups/sotka:/backups:ro
      # Каталог, а НЕ файл /var/spool/cron/crontabs/root: `crontab` при установке
      # подменяет файл целиком (пишет временный и переименовывает), то есть меняет
      # inode. Bind-mount на файл застрял бы на старом inode и вечно показывал
      # прежнее содержимое — проверка рапортовала бы «строка бэкапа на месте»
      # ровно в том случае, ради которого она и заведена.
      - /var/spool/cron/crontabs:/crontabs:ro
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    # Логи по умолчанию не ротируются: json.log воркера дорос до 182 МБ и вместе
    # с build-кэшем и journald подвёл диск к 93%.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=200 --max-memory-per-child=300000

  celery_beat:
    build: ./backend
    container_name: sotka_beat
    env_file: .env
    environment:
      PYTHONPATH: /app
      SOTKA_DB_NULLPOOL: "1"
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: celery -A worker.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    container_name: sotka_frontend
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
